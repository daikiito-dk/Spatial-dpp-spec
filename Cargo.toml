[workspace]
resolver = "2"
members = ["crates/sdpp-core", "crates/sdpp-cli", "crates/sdpp-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/daikiito-dk/Spatial-dpp-spec"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
prost = "0.13"
thiserror = "2"
wasm-bindgen = "0.2"

[profile.release]
lto = true
strip = true
